name: Test and build Windows app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Qt system libraries (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: test-results.xml

  build-windows:
    # Deliberately NOT 'needs: test': the first Windows run may show a test that assumes Linux; the program must still
    # be built and self-tested so it can be checked. Read both jobs' results.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: pyinstaller packaging/xeroxpro.spec --noconfirm --distpath dist --workpath build
      - name: Self-test the built program (Windows, real printer API, real fonts)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/XeroxPro/XeroxPro.exe" -ArgumentList "--selftest","dist/selftest.txt" -Wait -PassThru
          Get-Content dist/selftest.txt
          if ($p.ExitCode -ne 0) { throw "self-test failed (exit code $($p.ExitCode))" }
      - name: Zip the program folder
        shell: pwsh
        run: Compress-Archive -Path dist/XeroxPro -DestinationPath dist/XeroxPro-windows.zip
      - name: Installer (Inno Setup)
        shell: pwsh
        continue-on-error: true  # the zip is the guaranteed artifact; the installer is a convenience
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging/installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: XeroxPro-windows
          path: |
            dist/XeroxPro-windows.zip
            dist/XeroxPro-Setup-*.exe
            dist/selftest.txt
